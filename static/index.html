<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bali Concierge</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --jungle:   #0f1f1a;
      --deep:     #162820;
      --moss:     #1e3d30;
      --gold:     #c9a84c;
      --gold-dim: #8a6e2f;
      --sand:     #f2e8d5;
      --sand-dim: #c9b99a;
      --coral:    #d4704a;
      --white:    #faf8f3;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--jungle);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    /* Tropical background texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 15% 20%, rgba(201,168,76,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 85% 80%, rgba(30,61,48,0.6) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(212,112,74,0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      height: 92vh;
      max-height: 860px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      padding: 28px 0 18px;
      flex-shrink: 0;
    }

    .header-eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 400;
      color: var(--sand);
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    .header h1 em {
      font-style: italic;
      color: var(--gold);
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--gold-dim);
      margin: 14px auto 0;
    }

    /* ── Chat Card ── */
    .card {
      background: rgba(22, 40, 32, 0.7);
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(201,168,76,0.05),
        0 40px 80px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(201,168,76,0.1);
    }

    /* ── Messages ── */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--moss) transparent;
    }

    #chat-box::-webkit-scrollbar { width: 4px; }
    #chat-box::-webkit-scrollbar-track { background: transparent; }
    #chat-box::-webkit-scrollbar-thumb { background: var(--moss); border-radius: 2px; }

    .msg {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 16px;
      line-height: 1.65;
      animation: msgIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .msg.ai {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(201,168,76,0.12);
      color: var(--sand);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.ai::before {
      content: '✦';
      display: block;
      font-size: 10px;
      color: var(--gold);
      margin-bottom: 6px;
      letter-spacing: 2px;
    }

    .msg.user {
      background: linear-gradient(135deg, var(--gold) 0%, var(--coral) 100%);
      color: var(--jungle);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      font-weight: 500;
    }

    /* Typing indicator */
    .typing-dots {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(201,168,76,0.12);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      animation: msgIn 0.3s both;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      background: var(--gold);
      border-radius: 50%;
      animation: dot 1.2s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1);   opacity: 1; }
    }

    /* ── Suggestions ── */
    .suggestions {
      padding: 0 28px 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .chip {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 400;
      color: var(--sand-dim);
      border: 1px solid rgba(201,168,76,0.2);
      background: transparent;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .chip:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(201,168,76,0.07);
    }

    /* ── Input Area ── */
    .input-area {
      padding: 16px 20px 20px;
      border-top: 1px solid rgba(201,168,76,0.1);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 12px;
      padding: 13px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--sand);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #user-input::placeholder { color: rgba(194,185,154,0.4); }

    #user-input:focus {
      border-color: rgba(201,168,76,0.5);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.08);
    }

    #send-btn {
      background: linear-gradient(135deg, var(--gold) 0%, var(--coral) 100%);
      border: none;
      border-radius: 12px;
      width: 46px;
      height: 46px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s, transform 0.2s;
      flex-shrink: 0;
    }

    #send-btn:hover { opacity: 0.88; transform: translateY(-1px); }
    #send-btn:disabled { opacity: 0.3; cursor: default; transform: none; }

    #send-btn svg { width: 18px; height: 18px; fill: var(--jungle); }

    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 12px 0 4px;
      font-size: 11px;
      color: rgba(194,185,154,0.3);
      letter-spacing: 1px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="header-eyebrow">Island of the Gods</div>
      <h1>Bali <em>Concierge</em></h1>
      <div class="divider"></div>
    </header>

    <div class="card">
      <div id="chat-box">
        <div class="msg ai">Welcome to Bali 🌺 I'm your personal island guide — ask me about hidden temples, surf breaks, jungle treks, or the best warung for nasi goreng. I speak your language.</div>
      </div>

      <div class="suggestions">
        <button class="chip" onclick="ask('Best temples to visit at sunrise')">🛕 Sunrise temples</button>
        <button class="chip" onclick="ask('Where to surf in Bali')">🏄 Surf spots</button>
        <button class="chip" onclick="ask('Hidden waterfalls near Ubud')">💧 Waterfalls</button>
        <button class="chip" onclick="ask('Best local food in Seminyak')">🍜 Local food</button>
        <button class="chip" onclick="ask('3 day Bali itinerary')">🗺️ Itinerary</button>
      </div>

      <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask your guide anything about Bali…" autocomplete="off">
        <button id="send-btn" title="Send">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="footer">Powered by AWS Bedrock &nbsp;·&nbsp; Bali, Indonesia</div>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const input   = document.getElementById('user-input');
    const btn     = document.getElementById('send-btn');

    function addMessage(role, text = '') {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function showTyping() {
      const el = document.createElement('div');
      el.className = 'typing-dots';
      el.id = 'typing';
      el.innerHTML = '<span></span><span></span><span></span>';
      chatBox.appendChild(el);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    async function ask(q) {
      input.value = q;
      await sendMessage();
    }

    async function sendMessage() {
      const q = input.value.trim();
      if (!q) return;

      addMessage('user', q);
      input.value = '';
      btn.disabled = true;
      showTyping();

      const aiDiv = addMessage('ai', '');
      aiDiv.style.display = 'none';

      try {
        const response = await fetch(`/places/chat?q=${encodeURIComponent(q)}`);
        const reader   = response.body.getReader();
        const decoder  = new TextDecoder();

        removeTyping();
        aiDiv.style.display = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          aiDiv.innerText += decoder.decode(value, { stream: true });
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      } catch (e) {
        removeTyping();
        aiDiv.style.display = '';
        aiDiv.innerText = 'Connection lost in the jungle. Please try again 🌿';
      } finally {
        btn.disabled = false;
      }
    }

    btn.onclick = sendMessage;
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) sendMessage(); });
  </script>
</body>
</html>
