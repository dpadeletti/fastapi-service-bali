<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bali Travel Assistant 🌴</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f7f4; display: flex; justify-content: center; padding: 20px; }
        .chat-container { width: 100%; max-width: 600px; background: white; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #009688; color: white; padding: 20px; text-align: center; }
        #chat-box { height: 400px; overflow-y: auto; padding: 20px; border-bottom: 1px solid #eee; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 10px; max-width: 80% }
        .user { background: #e0f2f1; align-self: flex-end; }
        .ai { background: #f1f1f1; align-self: flex-start; line-height: 1.5; white-space: pre-wrap; }
        .input-area { display: flex; padding: 15px; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        button { background: #009688; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header"><h2>Bali Concierge 🏝️</h2></div>
        <div id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Chiedi qualcosa su Bali (es: sunset and temples)...">
            <button id="send-btn">Invia</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('user-input');
        const btn = document.getElementById('send-btn');

        function appendMessage(role, text = "") {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        btn.onclick = async () => {
            const query = input.value.trim();
            if (!query) return;

            appendMessage('user', query);
            input.value = '';
            btn.disabled = true;

            const aiMsgDiv = appendMessage('ai', '...');
            aiMsgDiv.innerText = ""; // Pulisce i puntini all'inizio dello streaming

            try {
                // Chiamata all'endpoint di streaming
                const response = await fetch(`/places/chat?q=${encodeURIComponent(query)}`);
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    aiMsgDiv.innerText += chunk; // Aggiunge il testo man mano che arriva
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            } catch (err) {
                aiMsgDiv.innerText = "Errore di connessione.";
            } finally {
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
