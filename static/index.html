<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Bali Travel Concierge 🏝️</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f4f4; margin: 0; display: flex; justify-content: center; padding: 40px 20px; }
        .container { width: 100%; max-width: 900px; }
        .chat-card { background: white; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); height: 700px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #e0e6e6; }
        .header { background: #00796b; color: white; padding: 25px; text-align: center; font-size: 1.4rem; font-weight: 600; }
        #chat-box { flex: 1; overflow-y: auto; padding: 35px; display: flex; flex-direction: column; gap: 20px; background: #fff; }
        .msg { padding: 16px 22px; border-radius: 18px; max-width: 80%; font-size: 16px; line-height: 1.6; position: relative; }
        .user { background: #00796b; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai { background: #f1f5f5; color: #2d3436; align-self: flex-start; border-left: 6px solid #00796b; border-bottom-left-radius: 4px; white-space: pre-wrap; }
        .input-area { padding: 25px; background: white; border-top: 1px solid #edf2f2; display: flex; gap: 15px; }
        input { flex: 1; padding: 15px; border: 1px solid #d1d8d8; border-radius: 12px; font-size: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: #00796b; box-shadow: 0 0 0 3px rgba(0,121,107,0.1); }
        button { background: #00796b; color: white; border: none; padding: 0 30px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        button:hover { background: #004d40; transform: translateY(-1px); }
        button:disabled { background: #b2dfdb; }
        .typing { font-size: 12px; color: #888; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="chat-card">
            <div class="header">Bali Concierge 🏝️</div>
            <div id="chat-box">
                <div class="msg ai">Sista! 🌺 Sono la tua guida locale. Chiedimi qualsiasi cosa su Bali, dai templi segreti ai posti migliori per il tuo cucciolo!</div>
            </div>
            <div id="status" style="padding: 0 35px; height: 20px;"></div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Chiedi alla guida (es: waterfalls itinerary)...">
                <button id="send-btn">Invia</button>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('user-input');
        const btn = document.getElementById('send-btn');
        const status = document.getElementById('status');

        function addMessage(role, content = "") {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.innerText = content;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const q = input.value.trim();
            if (!q) return;

            addMessage('user', q);
            input.value = '';
            btn.disabled = true;
            status.innerHTML = '<span class="typing">La guida sta pensando... 🌴</span>';

            const aiDiv = addMessage('ai');
            
            try {
                const response = await fetch(`/places/chat?q=${encodeURIComponent(q)}`);
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                status.innerHTML = '';
                aiDiv.innerText = ""; 

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    aiDiv.innerText += decoder.decode(value, { stream: true });
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            } catch (e) {
                aiDiv.innerText = "Ops, la connessione è caduta nella giungla. Riprova!";
            } finally {
                btn.disabled = false;
                status.innerHTML = '';
            }
        }

        btn.onclick = sendMessage;
        input.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
    </script>
</body>
</html>
