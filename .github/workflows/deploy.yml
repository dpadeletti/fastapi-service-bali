name: Deploy API to ECS (OIDC)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to confirm
        required: true
        default: ""
      reseed:
        description: Force reseed DB with embeddings? (yes/no)
        required: false
        default: "no"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPO: bali-api
  ECS_CLUSTER: bali-dev-cluster
  ECS_SERVICE: bali-dev-api
  CONTAINER_NAME: api
  DEPLOY_ROLE_ARN: arn:aws:iam::216571348735:role/github-actions-bali-api-deploy
  ENVIRONMENT: prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Guardrail
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "Confirmation missing. Type DEPLOY to run."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pre-check - verify ECS infrastructure
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER_STATUS="$(aws ecs describe-clusters --clusters "$ECS_CLUSTER" --query "clusters[0].status" --output text 2>/dev/null || true)"
          if [ "$CLUSTER_STATUS" != "ACTIVE" ]; then
            echo "Infra not found: ECS cluster '$ECS_CLUSTER' is missing or not ACTIVE."
            echo "Run: cd infra && terraform apply"
            exit 1
          fi

          SERVICE_STATUS="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query "services[0].status" --output text 2>/dev/null || true)"
          if [ "$SERVICE_STATUS" != "ACTIVE" ]; then
            echo "Infra not found: ECS service '$ECS_SERVICE' is missing or not ACTIVE."
            echo "Run: cd infra && terraform apply"
            exit 1
          fi

          echo "Infra OK: cluster and service found."

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (tag = git sha)
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

          echo "Building with GIT_SHA=$GITHUB_SHA"
          docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "$IMAGE_URI" .
          docker run --rm "$IMAGE_URI" sh -lc 'echo "Container GIT_SHA=$GIT_SHA" | grep -v "unknown"'
          docker push "$IMAGE_URI"

      - name: Get current task definition ARN from service
        shell: bash
        run: |
          set -euo pipefail
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[0].taskDefinition" \
            --output text > taskdef_arn.txt

      - name: Download current task definition JSON
        shell: bash
        run: |
          set -euo pipefail
          TASKDEF_ARN="$(cat taskdef_arn.txt)"
          aws ecs describe-task-definition \
            --task-definition "$TASKDEF_ARN" \
            --query "taskDefinition" \
            --output json > taskdef.json

      - name: Render new task definition with updated image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: taskdef.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}

      - name: Get Network Configuration
        run: |
          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query "services[0].networkConfiguration" \
            --output json)
          echo "NETWORK_CONFIG=$(echo $NETWORK_CONFIG | tr -d '\n')" >> $GITHUB_ENV

      - name: Register new Task Definition
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.render.outputs.task-definition }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "MIGRATION_TASK_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Run DB Migrations (One-off Task)
        run: |
          echo "Running Alembic migrations on ECS..."
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition ${{ env.MIGRATION_TASK_ARN }} \
            --launch-type FARGATE \
            --network-configuration '${{ env.NETWORK_CONFIG }}' \
            --overrides '{"containerOverrides": [{"name": "${{ env.CONTAINER_NAME }}", "command": ["sh", "-c", "alembic upgrade head && PYTHONPATH=. python scripts/seed_db.py"]}]}' \
            --count 1 \
            --query 'tasks[0].taskArn' \
            --output text)
          echo "Migration task ARN: $TASK_ARN"
          echo "MIGRATION_TASK_ARN_RUN=$TASK_ARN" >> $GITHUB_ENV

      - name: Wait for migrations to complete
        run: |
          echo "Waiting for migration task to stop..."
          aws ecs wait tasks-stopped \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$MIGRATION_TASK_ARN_RUN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$MIGRATION_TASK_ARN_RUN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          echo "Migration exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "❌ Migration failed with exit code $EXIT_CODE — deploy aborted."
            exit 1
          fi
          echo "✅ Migrations completed successfully."

      - name: Force Reseed with Embeddings (optional)
        if: ${{ github.event.inputs.reseed == 'yes' }}
        run: |
          echo "Force reseeding DB with Bedrock embeddings..."
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition ${{ env.MIGRATION_TASK_ARN }} \
            --launch-type FARGATE \
            --network-configuration '${{ env.NETWORK_CONFIG }}' \
            --overrides '{"containerOverrides": [{"name": "${{ env.CONTAINER_NAME }}", "command": ["sh", "-c", "PYTHONPATH=. python scripts/seed_db.py --force"], "environment": [{"name": "LLM_PROVIDER", "value": "bedrock"}, {"name": "AWS_REGION", "value": "eu-north-1"}, {"name": "ENVIRONMENT", "value": "prod"}]}]}' \
            --count 1 \
            --query 'tasks[0].taskArn' \
            --output text)
          echo "Reseed task ARN: $TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "❌ Reseed failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "✅ Reseed completed successfully."

      - name: Deploy to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true